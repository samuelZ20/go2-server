# docker-compose.yml — Go2 Voice Control (arquitetura completa)
#
# Lê o .env da raiz automaticamente. Trocar rede/robô = editar só o .env.
#
# ARQUITETURA DE VOZ:
#   [TV Box] ──TCP audio──▶ inference ──publish──▶ redis ──▶ robot-control ──▶ Go2
#
# REDE: usa a rede bridge padrão do Compose (não network_mode: host), para
# funcionar igual em Linux nativo, Docker Desktop (Windows/WSL2) e Docker
# Engine dentro do WSL2. Serviços se enxergam entre si pelo NOME (ex:
# "redis"), não por 127.0.0.1 — cada container tem seu próprio localhost
# isolado nesse modo. Só o 'inference' publica porta pro host (9876), já
# que é o único que recebe conexão externa (da TV box).
#
# ══════════════════════════════════════════════════════════════════════════════
#  COMANDOS
# ══════════════════════════════════════════════════════════════════════════════
#  Build de tudo:            docker compose build
#
#  ── Modo VOZ (produção) ──
#  Subir pipeline completo:  docker compose --profile voz up
#  Logs da inferência:       docker compose logs -f inference
#  Parar tudo:               docker compose down
#
#  ── Modo DEBUG: só inferência (redis + inference, SEM robot-control) ──
#  Útil para testar wake word / Whisper / classificador isoladamente,
#  sem precisar do robô físico conectado nem do robot-control rodando.
#    docker compose --profile inference-debug up
#
#  ── Modo KEYBOARD-CONTROL (teste manual do robô, sem voz) ──
#  Testar Go2 por teclado:   docker compose run --rm teclado
#
#  O 'teclado' NÃO sobe com 'up' (está no profile 'keyboard-control') — é
#  uma ferramenta interativa que você chama sob demanda com 'run'. É o
#  único jeito de testar o robô sem depender da inferência por voz.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Message broker ──────────────────────────────────────────────────────────
  # Sem 'ports:' de propósito — não precisa ser acessível de fora do
  # docker-compose, só pelos outros serviços via rede interna (nome "redis").
  redis:
    image: redis:7-alpine
    container_name: go2_redis
    restart: unless-stopped
    profiles: ["voz", "inference-debug"]

  # ── Pipeline de IA (OWW → Whisper medium → Classifier → Redis) ─────────────
  inference:
    build:
      context: ./inference
    container_name: go2_inference
    environment:
      - PC_SERVER_IP=${PC_SERVER_IP}
      - TCP_PORT=${TCP_PORT}
      - AUDIO_SAMPLE_RATE=${AUDIO_SAMPLE_RATE}
      - AUDIO_CHANNELS=${AUDIO_CHANNELS}
      - AUDIO_CHUNK_MS=${AUDIO_CHUNK_MS}
      - OWW_MODEL=${OWW_MODEL}
      - OWW_THRESHOLD=${OWW_THRESHOLD}
      - WAKE_COOLDOWN_S=${WAKE_COOLDOWN_S}
      - POST_WAKE_DISCARD_MS=${POST_WAKE_DISCARD_MS}
      - MIN_CMD_DURATION_S=${MIN_CMD_DURATION_S}
      - SILENCE_TIMEOUT_MS=${SILENCE_TIMEOUT_MS}
      - CMD_MAX_SECONDS=${CMD_MAX_SECONDS}
      - WHISPER_MODEL=${WHISPER_MODEL}
      - CPU_THREADS=${CPU_THREADS}
      - BEAM_SIZE=${BEAM_SIZE}
      - NO_SPEECH_THRESHOLD=${NO_SPEECH_THRESHOLD}
      - MAX_CMD_WORDS=${MAX_CMD_WORDS}
      - REPETITION_THRESHOLD=${REPETITION_THRESHOLD}
      - INTENT_THRESHOLD=${INTENT_THRESHOLD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=${REDIS_CHANNEL}
    ports:
      - "${TCP_PORT}:${TCP_PORT}"
    depends_on:
      - redis
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["voz", "inference-debug"]
    # ── Acesso à GPU NVIDIA. Requer NVIDIA driver + Docker Desktop com
    # suporte a GPU (já confirmado via `docker run --gpus all ... nvidia-smi`).
    # O código Python detecta e usa CUDA se disponível, com fallback
    # automático para CPU se não houver GPU ou a VRAM for insuficiente.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Controle do robô (Redis → Go2 WebRTC) ──────────────────────────────────
  # Só faz sentido junto do 'inference' — é ela quem publica os comandos
  # que o robot-control consome. Por isso só existe no profile 'voz'.
  # Não precisa de 'ports:' — a conexão com o Go2 (WebRTC) é de saída.
  robot-control:
    build:
      context: .
      dockerfile: robot_control/Dockerfile
    container_name: go2_robot
    environment:
      - ROBOT_IP=${ROBOT_IP}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=${REDIS_CHANNEL}
    depends_on:
      - redis
    restart: unless-stopped
    profiles: ["voz"]

  # ── Controle por teclado (teste manual do robô, sem voz) ────────────────────
  #  Não sobe com 'docker compose up'. Rode com:
  #    docker compose run --rm teclado
  #  Não depende do redis (controla o robô direto), então sem 'ports:'.
  teclado:
    build:
      context: .
      dockerfile: robot_control/Dockerfile
    container_name: go2_teclado
    environment:
      - ROBOT_IP=${ROBOT_IP}
    stdin_open: true
    tty: true
    command: ["python3", "scripts_teste/control_keyboard.py"]
    profiles: ["keyboard-control"]