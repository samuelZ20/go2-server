# docker-compose.yml — Go2 Voice Control (pipeline de inferência)
#
# Lê o .env da raiz automaticamente. Trocar rede/robô = editar só o .env.
#
# ARQUITETURA DE VOZ:
#   [TV Box] ──TCP audio──▶ inference ──HTTP──▶ go2-api (repo separado) ──▶ Go2
#
# O envio do comando final ao robô é responsabilidade do go2-api (repo
# separado, dono único da conexão WebRTC). Este compose cobre só a etapa
# de inferência (wake word → transcrição → classificação de intenção).
#
# REDE: usa a rede bridge padrão do Compose (não network_mode: host), para
# funcionar igual em Linux nativo, Docker Desktop (Windows/WSL2) e Docker
# Engine dentro do WSL2. Só o 'inference' publica porta pro host (9876), já
# que é o único que recebe conexão externa (da TV box).
#
# ══════════════════════════════════════════════════════════════════════════════
#  COMANDOS
# ══════════════════════════════════════════════════════════════════════════════
#  Build:                    docker compose build
#  Subir pipeline:           docker compose up
#  Logs:                     docker compose logs -f inference
#  Parar tudo:                docker compose down
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Pipeline de IA (OWW → Whisper medium → Classifier) ─────────────────────
  inference:
    build:
      context: ./inference
    container_name: go2_inference
    environment:
      - PC_SERVER_IP=${PC_SERVER_IP}
      - TCP_PORT=${TCP_PORT}
      - AUDIO_SAMPLE_RATE=${AUDIO_SAMPLE_RATE}
      - AUDIO_CHANNELS=${AUDIO_CHANNELS}
      - AUDIO_CHUNK_MS=${AUDIO_CHUNK_MS}
      - OWW_MODEL=${OWW_MODEL}
      - OWW_THRESHOLD=${OWW_THRESHOLD}
      - WAKE_COOLDOWN_S=${WAKE_COOLDOWN_S}
      - POST_WAKE_DISCARD_MS=${POST_WAKE_DISCARD_MS}
      - MIN_CMD_DURATION_S=${MIN_CMD_DURATION_S}
      - SILENCE_TIMEOUT_MS=${SILENCE_TIMEOUT_MS}
      - CMD_MAX_SECONDS=${CMD_MAX_SECONDS}
      - WHISPER_MODEL=${WHISPER_MODEL}
      - CPU_THREADS=${CPU_THREADS}
      - BEAM_SIZE=${BEAM_SIZE}
      - NO_SPEECH_THRESHOLD=${NO_SPEECH_THRESHOLD}
      - MAX_CMD_WORDS=${MAX_CMD_WORDS}
      - REPETITION_THRESHOLD=${REPETITION_THRESHOLD}
      - INTENT_THRESHOLD=${INTENT_THRESHOLD}
    ports:
      - "${TCP_PORT}:${TCP_PORT}"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # ── Acesso à GPU NVIDIA. Requer NVIDIA driver + Docker Desktop com
    # suporte a GPU (já confirmado via `docker run --gpus all ... nvidia-smi`).
    # O código Python detecta e usa CUDA se disponível, com fallback
    # automático para CPU se não houver GPU ou a VRAM for insuficiente.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
